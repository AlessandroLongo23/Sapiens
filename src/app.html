<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<title>Sapiens</title>
		<link rel="icon" href="icon.png" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta property="og:title" content="Sapiens" />
		<meta property="og:description" content="Contenuti didattici online per materie scientifiche" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://sapiens-xi.vercel.app/" />
		<meta property="og:image" content="https://sapiens-xi.vercel.app/icon.png" />
		<meta property="og:locale" content="it_IT" />

		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
					var theme = stored || (prefersDark ? 'dark' : 'light');
					var root = document.documentElement;
					root.classList.add('disable-transitions');
					root.classList.toggle('dark', theme === 'dark');
					setTimeout(function(){ root.classList.remove('disable-transitions'); }, 120);
				} catch (e) {}
			})();
		</script>
		
		<link rel="stylesheet" type="text/css" href="http://tikzjax.com/v1/fonts.css">
		<script src="https://tikzjax.com/v1/tikzjax.js"></script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
